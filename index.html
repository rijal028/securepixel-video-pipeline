<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel - Multimodal Forensic Pipeline</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 680px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
        }
        h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .config-box { 
            margin-bottom: 20px; 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .config-box label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .config-box input { 
            width: 100%; 
            background: #1e293b; 
            border: 1px solid #475569; 
            color: #f8fafc; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 13px; 
        }
        .upload-box { 
            border: 2px dashed #475569; 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            background: #0f172a; 
            margin-bottom: 20px; 
            transition: border-color 0.2s;
        }
        .upload-box:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        button { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 15px; 
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #resultCard { 
            display: none; 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid #334155; 
        }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .badge-verified { background: #065f46; color: #34d399; }
        .badge-inconclusive { background: #78350f; color: #fde68a; }
        .badge-ai { background: #991b1b; color: #fca5a5; }
        .badge-natural { background: #065f46; color: #6ee7b7; }
        pre { 
            background: #0b0f19; 
            color: #a5f3fc; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 12px; 
            overflow-x: auto; 
            border: 1px solid #1e293b; 
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🛡️ SecurePixel Multimodal Pipeline</h1>
    <p class="subtitle">Media Forensics Suite: Image (ViT+FFT), Audio (Wav2Vec2+Acoustics), and Video Temporal Aggregation.</p>

    <div class="config-box">
        <label for="engineUrl">Kaggle / Colab Cloudflare Tunnel Endpoint URL:</label>
        <input type="text" id="engineUrl" placeholder="https://xxxx-xxxx.trycloudflare.com">
    </div>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span id="uploadLabel">📁 Click to select an image, video, or audio file</span>
        <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.mp3,.wav,.ogg,.m4a" onchange="handleFileSelected(event)">
    </div>

    <button type="button" id="btnSubmit" onclick="runPipeline()" disabled>Start Verification</button>

    <div id="resultCard">
        <p><strong>Final Verdict:</strong> <span id="resVerdict" class="badge"></span></p>
        <p><strong>Forensic Rationale:</strong> <span id="resReason" style="color: #cbd5e1;"></span></p>
        <p><strong>Execution Route:</strong> <span id="resPipeline" style="color: #38bdf8;"></span></p>
        <p style="margin-top: 15px; font-size: 13px; color: #94a3b8;">Detailed Forensic Metrics:</p>
        <pre id="resData"></pre>
    </div>
</div>

<script>
    let selectedFile = null;

    function handleFileSelected(e) {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
            let icon = "📁";
            if (selectedFile.type.startsWith("video/")) icon = "🎥";
            else if (selectedFile.type.startsWith("image/")) icon = "🖼️";
            else if (selectedFile.type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a)$/i.test(selectedFile.name)) icon = "🎙️";
            
            document.getElementById('uploadLabel').innerText = `${icon} ${selectedFile.name} (${sizeMB} MB)`;
            document.getElementById('btnSubmit').disabled = false;
        }
    }

    async function checkClientC2PA(file) {
        const slice = file.slice(0, 131072);
        const buffer = await slice.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const text = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
        return text.includes("c2pa") || text.includes("urn:c2pa") || text.includes("jumb");
    }

    async function extractVideoKeyframes(videoFile, maxFrames = 4) {
        return new Promise((resolve, reject) => {
            const video = document.createElement("video");
            video.preload = "metadata";
            video.src = URL.createObjectURL(videoFile);
            video.muted = true;
            video.playsInline = true;

            video.onerror = () => {
                URL.revokeObjectURL(video.src);
                reject(new Error("Browser hardware decoder failed to read video format."));
            };

            video.onloadedmetadata = async () => {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const frames = [];
                const duration = Math.max(video.duration, 1.0);
                const step = duration / (maxFrames + 1);

                for (let i = 1; i <= maxFrames; i++) {
                    video.currentTime = i * step;
                    await new Promise((res) => { video.onseeked = res; });

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.90));
                    frames.push(new File([blob], `frame_${i}.jpg`, { type: "image/jpeg" }));
                }

                URL.revokeObjectURL(video.src);
                resolve(frames);
            };
        });
    }

    function setBadgeStyle(verdict, element) {
        element.innerText = verdict;
        if (verdict === "LIKELY AI-GENERATED") {
            element.className = "badge badge-ai";
        } else if (verdict === "LIKELY NATURAL CAPTURE") {
            element.className = "badge badge-natural";
        } else if (verdict === "VERIFIED ORIGIN") {
            element.className = "badge badge-verified";
        } else {
            element.className = "badge badge-inconclusive";
        }
    }

    async function runPipeline() {
        if (!selectedFile) return;

        const btn = document.getElementById('btnSubmit');
        const resultCard = document.getElementById('resultCard');
        const verdictEl = document.getElementById('resVerdict');
        const rawEndpoint = document.getElementById('engineUrl').value.trim();

        btn.disabled = true;
        resultCard.style.display = "none";

        const isVideo = selectedFile.type.startsWith("video/");
        const isAudio = selectedFile.type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a)$/i.test(selectedFile.name);

        try {
            // ----------------------------------------------------
            // STAGE 1: LOCAL PROVENANCE (C2PA) CHECK (IMAGES/VIDEOS)
            // ----------------------------------------------------
            if (!isAudio) {
                btn.innerText = "Stage 1: Scanning local file header for C2PA manifests...";
                const hasC2PA = await checkClientC2PA(selectedFile);
                if (hasC2PA) {
                    resultCard.style.display = "block";
                    setBadgeStyle("VERIFIED ORIGIN", verdictEl);
                    document.getElementById('resReason').innerText = "Valid C2PA Content Credentials provenance seal detected directly on the file header.";
                    document.getElementById('resPipeline').innerText = "Autonomous Client-Side Verification (Zero server inference required)";
                    document.getElementById('resData').innerText = JSON.stringify({
                        file_name: selectedFile.name,
                        media_type: selectedFile.type,
                        has_c2pa: true,
                        verdict: "VERIFIED ORIGIN"
                    }, null, 2);
                    return;
                }
            }

            if (!rawEndpoint) {
                throw new Error("Colab / Kaggle Endpoint URL is required for neural inference.");
            }

            const cleanUrl = rawEndpoint.replace(/\/+$/, "");
            const requestHeaders = {
                "Bypass-Tunnel-Reminder": "true",
                "ngrok-skip-browser-warning": "true"
            };

            // ----------------------------------------------------
            // WORKFLOW A: VIDEO TEMPORAL AGGREGATION
            // ----------------------------------------------------
            if (isVideo) {
                btn.innerText = "Extracting video frames via local Canvas...";
                const frames = await extractVideoKeyframes(selectedFile, 4);
                const frameResults = [];

                for (let i = 0; i < frames.length; i++) {
                    btn.innerText = `Analyzing video frame ${i + 1} of ${frames.length}...`;
                    const frameData = new FormData();
                    frameData.append("file", frames[i]);

                    const res = await fetch(`${cleanUrl}/predict/image`, {
                        method: "POST",
                        headers: requestHeaders,
                        body: frameData
                    });

                    if (!res.ok) {
                        const err = await res.text();
                        throw new Error(`Engine error on frame ${i + 1}: ${err.substring(0, 100)}`);
                    }
                    const data = await res.json();
                    frameResults.push(data);
                }

                resultCard.style.display = "block";
                const aiVotes = frameResults.filter(r => r.verdict === "LIKELY AI-GENERATED").length;
                const naturalVotes = frameResults.filter(r => r.verdict === "LIKELY NATURAL CAPTURE").length;

                let finalVerdict = "INCONCLUSIVE";
                let finalReason = "Frame metrics yielded conflicting forensic signals across the video sequence.";

                if (aiVotes >= Math.ceil(frameResults.length * 0.5)) {
                    finalVerdict = "LIKELY AI-GENERATED";
                    finalReason = `Synthetic generative signatures identified consistently across ${aiVotes} of ${frameResults.length} sampled frames.`;
                } else if (naturalVotes >= Math.ceil(frameResults.length * 0.5)) {
                    finalVerdict = "LIKELY NATURAL CAPTURE";
                    finalReason = `Natural optical characteristics confirmed consistently across ${naturalVotes} of ${frameResults.length} sampled frames.`;
                }

                setBadgeStyle(finalVerdict, verdictEl);
                document.getElementById('resReason').innerText = finalReason;
                document.getElementById('resPipeline').innerText = `Temporal Video Aggregation (${frames.length} keyframes via ViT+FFT)`;
                document.getElementById('resData').innerText = JSON.stringify({
                    file_name: selectedFile.name,
                    total_sampled_frames: frames.length,
                    ai_votes: aiVotes,
                    natural_votes: naturalVotes,
                    frame_metrics: frameResults
                }, null, 2);
                return;
            }

            // ----------------------------------------------------
            // WORKFLOW B: AUDIO DEEPFAKE DETECTION
            // ----------------------------------------------------
            if (isAudio) {
                btn.innerText = "Analyzing acoustic spectrum & phoneme features via Wav2Vec2...";
                const formData = new FormData();
                formData.append("file", selectedFile);

                const res = await fetch(`${cleanUrl}/predict/audio`, {
                    method: "POST",
                    headers: requestHeaders,
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`Audio engine error (${res.status}): ${err.substring(0, 120)}`);
                }

                const data = await res.json();
                resultCard.style.display = "block";
                setBadgeStyle(data.verdict, verdictEl);
                document.getElementById('resReason').innerText = data.reason;
                document.getElementById('resPipeline').innerText = data.execution_route || "Acoustic Inference (Wav2Vec2 + Spectral Roll-off)";
                document.getElementById('resData').innerText = JSON.stringify(data, null, 2);
                return;
            }

            // ----------------------------------------------------
            // WORKFLOW C: SINGLE IMAGE FORENSIC DETECTION
            // ----------------------------------------------------
            btn.innerText = "Executing visual neural & spectral 2D FFT inference...";
            const formData = new FormData();
            formData.append("file", selectedFile);

            const resBackend = await fetch(`${cleanUrl}/predict/image`, {
                method: "POST",
                headers: requestHeaders,
                body: formData
            });

            if (!resBackend.ok) {
                const errDetail = await resBackend.text();
                throw new Error(`Backend error (${resBackend.status}): ${errDetail.substring(0, 120)}`);
            }

            const dataBackend = await resBackend.json();
            resultCard.style.display = "block";
            setBadgeStyle(dataBackend.verdict, verdictEl);
            document.getElementById('resReason').innerText = dataBackend.reason;
            document.getElementById('resPipeline').innerText = dataBackend.execution_route || "Direct Multi-Stage Inference (ViT-Base + Spectral FFT)";
            document.getElementById('resData').innerText = JSON.stringify(dataBackend, null, 2);

        } catch (err) {
            alert("System exception: " + err.message);
        } finally {
            btn.innerText = "Start Verification";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
