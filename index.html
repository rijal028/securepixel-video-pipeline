<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel - Media Authenticity Verifier</title>
    <!-- Supabase JS Client for Redress Telemetry -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
        }
        h1 { margin-top: 0; font-size: 24px; color: #38bdf8; text-align: center; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; text-align: center; }
        
        /* File Picker */
        .file-select-area {

            border: 2px dashed #475569;
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;

            margin: 8px auto;
            color: #94a3b8;

        /* Media Preview */
        #previewContainer {
            display: none;

            font-size: 12px;

            background: #0284c7; 
            color: white; 
            border: none;

            font-weight: 600;

            cursor: pointer; 
            width: 100%; 
            font-size: 15px; 
            transition: background 0.2s;
        }
        button.btn-primary:hover { background: #0369a1; }
        button.btn-primary:disabled { background: #475569; cursor: not-allowed; }
        
        /* Result Stamp Section */
        #resultCard { 
            display: none; 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid #334155; 
        }

        .verdict-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            margin-bottom: 16px;
        }

        /* Large Clean Badges / Stamps */
        .stamp-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stamp-generate { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

        /* Video Dual-Track Clean Grid */
        .video-split-grid {

        .split-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;

        .split-card .stamp-badge {
            font-size: 12px;

        /* Redress Section */
        .flag-container {
            margin-top: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;

            justify-content: space-between;

        .btn-flag {
            background: transparent;
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-flag:hover { background: #450a0a; }
        .flag-form {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #334155;
        }
        .flag-form select, .flag-form textarea {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .btn-submit-flag {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px;
            font-size: 13px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-submit-flag:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="card">
    <h1>🛡️ SecurePixel</h1>
    <p class="subtitle">Authenticate and verify digital media authenticity within a split second.</p>

    <!-- File Picker -->
    <div class="file-select-area">
        <label style="font-size: 13px; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 6px;">Choose an image, video, or audio file:</label>
        <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.mp3,.wav,.ogg,.m4a" onchange="handleFileSelected(this)">
    </div>

    <!-- Media Preview -->
    <div id="previewContainer">
        <img id="previewImage" alt="Preview">
        <video id="previewVideo" controls></video>
        <audio id="previewAudio" controls></audio>
        <div id="previewMeta"></div>
    </div>

    <button type="button" id="btnSubmit" class="btn-primary" onclick="runPipeline()" disabled>Verify Authenticity</button>

    <div id="resultCard">
        <!-- Single Track Verdict Box (Image / Audio) -->
        <div id="singleResultContainer">
            <div class="verdict-box">
                <div id="resBadge" class="stamp-badge"></div>
                <p id="resDescription" class="verdict-desc"></p>
            </div>
        </div>

        <!-- Video Dual-Track Verdict Box -->
        <div id="videoResultContainer" style="display: none;">
            <div class="video-split-grid">
                <div class="split-card">
                    <h4>👁️ VISUAL TRACK</h4>
                    <div id="vidVisualBadge" class="stamp-badge"></div>
                    <p id="vidVisualDesc" class="verdict-desc" style="font-size: 12px;"></p>
                </div>
                <div class="split-card">
                    <h4>🎙️ AUDIO TRACK</h4>
                    <div id="vidAudioBadge" class="stamp-badge"></div>
                    <p id="vidAudioDesc" class="verdict-desc" style="font-size: 12px;"></p>
                </div>
            </div>
        </div>

        <!-- Discrepancy & Redress -->
        <div class="flag-container">
            <div class="flag-header">
                <span style="font-size: 13px; color: #94a3b8;">Believe this result is inaccurate?</span>
                <button type="button" class="btn-flag" onclick="toggleFlagForm()">Flag Result</button>
            </div>
            <div id="flagForm" class="flag-form">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 4px;">Issue Type:</label>
                <select id="flagType">
                    <option value="false_positive">Genuine media flagged as AI</option>
                    <option value="false_negative">AI media flagged as Authentic</option>
                    <option value="other">Inconclusive or unexpected result</option>
                </select>
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 4px;">Context (Optional):</label>
                <textarea id="flagNotes" rows="2" placeholder="e.g., Captured on Sony A7IV or generated via Midjourney..."></textarea>
                <button type="button" id="btnSendFlag" class="btn-submit-flag" onclick="submitTelemetryFlag()">Submit Feedback</button>
                <p id="flagSuccess" style="display: none; font-size: 12px; color: #34d399; margin-top: 8px; text-align: center;">Feedback recorded. Zero biometric or personal media was stored.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // CLOUDFLARE TUNNEL URL (Sinkronkan dengan output cell Kaggle yang aktif)
    // =========================================================================
    const DEFAULT_BACKEND_URL = "https://viewpicture-subsidiaries-ratings-watt.trycloudflare.com";
    // =========================================================================

    let sbClient = null;
    try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
            sbClient = window.supabase.createClient(
                "https://sihzvffweusqdsszgmcd.supabase.co",
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaHp2ZmZ3ZXVzcWRzc3pnbWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MDczNzEsImV4cCI6MjEwNTE4MzM3MX0.xJ5vZa5HOW349_UJ7nVUfM97DHvcuYZLvxzqL6mIy4g"
            );
        }
    } catch (e) {
        console.warn("Supabase init deferred:", e);
    }

    let selectedFile = null;
    let lastVerdictResult = null;
    let currentObjectUrl = null;

    function handleFileSelected(inputElement) {
        if (!inputElement.files || inputElement.files.length === 0) return;

        selectedFile = inputElement.files[0];

        const btn = document.getElementById('btnSubmit');
        btn.disabled = false;
        btn.innerText = "Verify Authenticity";

        try {
            const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
            const fileType = selectedFile.type;
            const fileName = selectedFile.name;

            const pContainer = document.getElementById('previewContainer');
            const pImg = document.getElementById('previewImage');
            const pVid = document.getElementById('previewVideo');
            const pAud = document.getElementById('previewAudio');
            const pMeta = document.getElementById('previewMeta');

            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
            }
            currentObjectUrl = URL.createObjectURL(selectedFile);

            pImg.style.display = "none";
            pVid.style.display = "none";
            pAud.style.display = "none";

            if (fileType.startsWith("video/")) {
                pVid.src = currentObjectUrl;
                pVid.style.display = "block";
            } else if (fileType.startsWith("audio/") || /\.(mp3|wav|ogg|m4a)$/i.test(fileName)) {
                pAud.src = currentObjectUrl;
                pAud.style.display = "block";
            } else {
                pImg.src = currentObjectUrl;
                pImg.style.display = "block";
            }

            pContainer.style.display = "block";
            pMeta.innerText = `${fileName} • ${sizeMB} MB`;
        } catch (err) {
            console.error("Preview render error:", err);
        }
    }

    // Client-side C2PA Check
    async function inspectClientC2PA(file) {
        const readSize = Math.min(file.size, 2097152);
        const slice = file.slice(0, readSize);
        const buffer = await slice.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const text = new TextDecoder("utf-8", { fatal: false }).decode(bytes).toLowerCase();

        const hasContainer = text.includes("c2pa") || text.includes("urn:c2pa") || text.includes("jumb");
        if (!hasContainer) return { detected: false };

        const syntheticMarkers = ["trainedalgorithmicmedia", "generativesynthesis", "c2pa.synthetic", "synthid", "dall-e", "midjourney", "gemini"];
        const isSynthetic = syntheticMarkers.some(m => text.includes(m));

        return {
            detected: true,
            isSynthetic: isSynthetic
        };
    }

    // Perceptual hash untuk feedback aman (tanpa simpan media mentah)
    async function computePerceptualHash(file) {
        if (!file.type.startsWith("image/")) {
            return "stream_id_" + file.size;
        }
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement("canvas");
                canvas.width = 8;
                canvas.height = 8;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, 8, 8);
                const imgData = ctx.getImageData(0, 0, 8, 8).data;
                
                let sum = 0;
                const grays = [];
                for (let i = 0; i < imgData.length; i += 4) {
                    const gray = imgData[i] * 0.299 + imgData[i + 1] * 0.587 + imgData[i + 2] * 0.114;
                    grays.push(gray);
                    sum += gray;
                }
                const avg = sum / grays.length;
                let hash = "";
                for (let g of grays) {
                    hash += g >= avg ? "1" : "0";
                }
                URL.revokeObjectURL(img.src);
                resolve(parseInt(hash, 2).toString(16).padStart(16, "0"));
            };
            img.onerror = () => resolve("phash_fallback_" + Date.now());
        });
    }

    // Ekstraksi frame video di browser
    async function extractVideoKeyframes(videoFile, maxFramesCap = 6) {
        return new Promise((resolve, reject) => {
            const video = document.createElement("video");
            video.preload = "metadata";
            video.src = URL.createObjectURL(videoFile);
            video.muted = true;
            video.playsInline = true;

            video.onerror = () => {
                URL.revokeObjectURL(video.src);
                reject(new Error("Unable to read video frames."));
            };

            video.onloadedmetadata = async () => {
                const durationSec = Math.floor(video.duration);
                const frameCount = Math.min(Math.max(durationSec, 1), maxFramesCap);

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const frames = [];
                for (let i = 1; i <= frameCount; i++) {
                    video.currentTime = Math.min(i, Math.max(0.1, video.duration - 0.1));
                    await new Promise((res) => { video.onseeked = res; });

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.90));
                    frames.push(new File([blob], `frame_${i}.jpg`, { type: "image/jpeg" }));
                }

                URL.revokeObjectURL(video.src);
                resolve(frames);
            };
        });
    }

    // Ekstraksi audio browser via Web Audio API
    async function extractAudioFromVideoClient(videoFile) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await videoFile.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const targetSampleRate = 16000;
            const captureDuration = Math.min(audioBuffer.duration, 4.5);
            const offlineCtx = new OfflineAudioContext(1, Math.floor(targetSampleRate * captureDuration), targetSampleRate);
            
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start(0);

            const renderedBuffer = await offlineCtx.startRendering();
            const channelData = renderedBuffer.getChannelData(0);

            const wavBytes = encodeWAV(channelData, targetSampleRate);
            const wavBlob = new Blob([wavBytes], { type: "audio/wav" });
            return new File([wavBlob], "audio_track.wav", { type: "audio/wav" });
        } catch (e) {
            return null;
        }
    }

    function encodeWAV(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        function writeString(offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        return buffer;
    }

    // Terapkan Stempel Resmi Sesuai Dokumen Benchmark
    function applyVerdictStamp(verdict, badgeEl, descEl, customDesc) {
        if (verdict === "LIKELY AI-GENERATED") {
            badgeEl.className = "stamp-badge stamp-generate";
            badgeEl.innerText = "🤖 LIKELY AI-GENERATED";
            descEl.innerText = customDesc || "Synthetic latent generative traits identified.";
        } else if (verdict === "LIKELY NATURAL CAPTURE") {
            badgeEl.className = "stamp-badge stamp-natural";
            badgeEl.innerText = "📷 LIKELY NATURAL CAPTURE";
            descEl.innerText = customDesc || "Physical camera sensor optical noise confirmed.";
        } else if (verdict === "VERIFIED ORIGIN") {
            badgeEl.className = "stamp-badge stamp-origin";
            badgeEl.innerText = "🛡️ VERIFIED ORIGIN";
            descEl.innerText = customDesc || "Valid cryptographic provenance seal confirmed.";
        } else if (verdict === "NO_AUDIO_STREAM" || verdict === "NO_AUDIO") {
            badgeEl.className = "stamp-badge stamp-neutral";
            badgeEl.innerText = "NO AUDIO TRACK";
            descEl.innerText = "No audio stream detected.";
        } else {
            badgeEl.className = "stamp-badge stamp-inconclusive";
            badgeEl.innerText = "⚠️ INCONCLUSIVE";
            descEl.innerText = customDesc || "Ambiguous forensic signals; system safely abstained.";
        }
    }

    function toggleFlagForm() {
        const form = document.getElementById('flagForm');
        form.style.display = form.style.display === "block" ? "none" : "block";
    }

    async function submitTelemetryFlag() {
        if (!lastVerdictResult) return;
        const btn = document.getElementById('btnSendFlag');
        const successEl = document.getElementById('flagSuccess');
        btn.disabled = true;
        btn.innerText = "Submitting...";

        try {
            if (!sbClient) throw new Error("Feedback service unavailable.");

            const phash = await computePerceptualHash(selectedFile);
            const flagPayload = {
                media_type: selectedFile.type.startsWith("video/") ? "video" : (selectedFile.type.startsWith("audio/") ? "audio" : "image"),
                phash: phash,
                reported_error: document.getElementById('flagType').value,
                user_notes: document.getElementById('flagNotes').value.trim(),
                system_verdict: lastVerdictResult.verdict || "UNKNOWN",
                is_verified: false
            };

            const { error } = await sbClient.from('forensic_telemetry').insert([flagPayload]);
            if (error) throw error;

            successEl.style.display = "block";
            btn.innerText = "Submitted";
        } catch (err) {
            alert("Error submitting feedback: " + err.message);
            btn.disabled = false;
            btn.innerText = "Submit Feedback";
        }
    }

    async function runPipeline() {
        if (!selectedFile) return;

        const btn = document.getElementById('btnSubmit');
        const resultCard = document.getElementById('resultCard');
        const singleContainer = document.getElementById('singleResultContainer');
        const videoContainer = document.getElementById('videoResultContainer');
        const badgeEl = document.getElementById('resBadge');
        const descEl = document.getElementById('resDescription');
        const cleanUrl = DEFAULT_BACKEND_URL.replace(/\/+$/, "");

        btn.disabled = true;
        resultCard.style.display = "none";
        singleContainer.style.display = "block";
        videoContainer.style.display = "none";
        document.getElementById('flagForm').style.display = "none";
        document.getElementById('flagSuccess').style.display = "none";

        const isVideo = selectedFile.type.startsWith("video/");
        const isAudio = selectedFile.type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a)$/i.test(selectedFile.name);

        try {
            // C2PA Quick Check
            if (!isAudio) {
                btn.innerText = "Checking file credentials...";
                const c2pa = await inspectClientC2PA(selectedFile);
                if (c2pa.detected) {
                    resultCard.style.display = "block";
                    if (c2pa.isSynthetic) {
                        applyVerdictStamp("LIKELY AI-GENERATED", badgeEl, descEl, "Synthetic credentials detected in file header.");
                        lastVerdictResult = { verdict: "LIKELY AI-GENERATED" };
                    } else {
                        applyVerdictStamp("VERIFIED ORIGIN", badgeEl, descEl, "Valid cryptographic provenance seal confirmed.");
                        lastVerdictResult = { verdict: "VERIFIED ORIGIN" };
                    }
                    return;
                }
            }

            // Video Dual-Track Flow
            if (isVideo) {
                btn.innerText = "Analyzing video frames...";
                resultCard.style.display = "block";
                singleContainer.style.display = "none";
                videoContainer.style.display = "block";

                const frames = await extractVideoKeyframes(selectedFile, 6);
                let aiVotes = 0;
                let naturalVotes = 0;

                for (let i = 0; i < frames.length; i++) {
                    const frameData = new FormData();
                    frameData.append("file", frames[i]);
                    const res = await fetch(`${cleanUrl}/predict/image`, { method: "POST", body: frameData });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.verdict === "LIKELY AI-GENERATED") aiVotes++;
                        if (data.verdict === "LIKELY NATURAL CAPTURE") naturalVotes++;
                    }
                }

                let vVerdict = "INCONCLUSIVE";
                if (aiVotes >= Math.ceil(frames.length * 0.5)) vVerdict = "LIKELY AI-GENERATED";
                else if (naturalVotes >= Math.ceil(frames.length * 0.5)) vVerdict = "LIKELY NATURAL CAPTURE";

                applyVerdictStamp(vVerdict, document.getElementById('vidVisualBadge'), document.getElementById('vidVisualDesc'));

                // Audio extraction & verification
                const extractedWav = await extractAudioFromVideoClient(selectedFile);
                if (!extractedWav) {
                    applyVerdictStamp("NO_AUDIO_STREAM", document.getElementById('vidAudioBadge'), document.getElementById('vidAudioDesc'));
                } else {
                    const audioFormData = new FormData();
                    audioFormData.append("file", extractedWav);
                    const resAudio = await fetch(`${cleanUrl}/predict/audio`, { method: "POST", body: audioFormData });
                    if (resAudio.ok) {
                        const aData = await resAudio.json();
                        applyVerdictStamp(aData.verdict, document.getElementById('vidAudioBadge'), document.getElementById('vidAudioDesc'), aData.description);
                    } else {
                        applyVerdictStamp("INCONCLUSIVE", document.getElementById('vidAudioBadge'), document.getElementById('vidAudioDesc'));
                    }
                }

                lastVerdictResult = { verdict: vVerdict };
                return;
            }

            // Audio Flow
            if (isAudio) {
                btn.innerText = "Verifying acoustic dynamics...";
                const formData = new FormData();
                formData.append("file", selectedFile);
                const res = await fetch(`${cleanUrl}/predict/audio`, { method: "POST", body: formData });
                if (!res.ok) throw new Error("Audio verification service failed.");
                
                const data = await res.json();
                resultCard.style.display = "block";
                applyVerdictStamp(data.verdict, badgeEl, descEl, data.description);
                lastVerdictResult = data;
                return;
            }

            // Image Flow
            btn.innerText = "Analyzing image sensor characteristics...";
            const formData = new FormData();
            formData.append("file", selectedFile);
            const res = await fetch(`${cleanUrl}/predict/image`, { method: "POST", body: formData });
            if (!res.ok) throw new Error("Image verification service failed.");

            const data = await res.json();
            resultCard.style.display = "block";
            applyVerdictStamp(data.verdict, badgeEl, descEl, data.description);
            lastVerdictResult = data;

        } catch (err) {
            console.error("Verification error:", err);
            alert("Verification failed: " + err.message);
        } finally {
            btn.innerText = "Verify Authenticity";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
